<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Global English select state QA</title>
    <link rel="stylesheet" href="../../../global-english/assets/css/main.css">
</head>
<body>
    <main class="section">
        <div class="container">
            <form class="trial-form">
                <div class="form-field form-field--wide">
                    <label class="sr-only" for="qa-language-inline">Выберите язык</label>
                    <select id="qa-language-inline" name="language-inline">
                        <option value="">Выберите язык</option>
                        <option value="english">Английский язык</option>
                        <option value="chinese">Китайский язык</option>
                    </select>
                </div>
                <div class="form-field form-field--wide">
                    <label class="sr-only" for="qa-language-modal">Выберите язык в модальной форме</label>
                    <select id="qa-language-modal" name="language-modal" aria-invalid="true">
                        <option value="">Выберите язык</option>
                        <option value="english">Английский язык</option>
                        <option value="chinese">Китайский язык</option>
                    </select>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
